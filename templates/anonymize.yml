##
# Règles du projet, à copier dans .github/anonymize.yml. Elles l'emportent sur
# les règles communes (typo3-core). Format : README.md de tm-workflows.
# Sans ce fichier, le job liste les tables à classer.
##

settings:
  email_scan: warn          # warn | block | replace | off
  allowed_email_domains:    # adresses conservées (ex. domaine du client)
    - client.example
  # key_column: id          # clé des stratégies email, username… (défaut uid)

tables:
  tx_monextension_domain_model_comment: truncate
  "tx_monextension_domain_model_rate*": keep
  tx_monextension_domain_model_member:
    update:
      email: email
      name: full_name
      phone: empty
      notes: {fixed: "Note fictive"}
  # wp_users:               # clé propre à une table
  #   key: ID
  #   update:
  #     user_email: email

  # devlog, gridelements, news, powermail et solr sont déjà classés dans les
  # règles communes : ne les reprendre ici que pour un traitement différent.
