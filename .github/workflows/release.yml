name: Release
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: Semantic Release (dry-run)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --dry-run

      - name: Semantic Release
        id: release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --match : sans filtre, git describe retourne aussi les tags flottants
        # (v1, v1.14) et le numéro de version calculé est faux.
        run: |
          MATCH='v[0-9]*.[0-9]*.[0-9]*'
          before=$(git describe --tags --abbrev=0 --match "$MATCH" 2>/dev/null || echo none)

          npx semantic-release

          git fetch --tags --force
          after=$(git describe --tags --abbrev=0 --match "$MATCH" 2>/dev/null || echo none)

          echo "version=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" != "$after" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Aucune version publiée, tags flottants inchangés."
          fi

      # Conditionné à une publication : sinon v1 avancerait sur un commit sans version.
      - name: Update floating tags
        if: github.event_name == 'push' && steps.release.outputs.published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          CLEAN_VERSION=${VERSION#v}

          MAJOR=$(echo "$CLEAN_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_VERSION" | cut -d. -f1,2)

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag -f "v$MAJOR"
          git push origin "v$MAJOR" --force

          git tag -f "v$MINOR"
          git push origin "v$MINOR" --force
