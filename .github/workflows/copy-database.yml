##
# Exporte la base de prod vers S3 (latest.sql) et, si TM_ANONYMIZE=true,
# sa version anonymisée (latest_anonymized.sql). Voir README.md.
##

name: Copy Database

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      tools-ref:
        description: Référence de tm-workflows pour l'action d'anonymisation (branche pendant un pilote)
        required: false
        type: string
        default: v1
    secrets:
      aws-oidc-role-arn:
        required: true
      tm-tmdt-aws-oidc-role-arn:
        required: true

jobs:
  Export:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    container:
      image: ghcr.io/toumoro/tm-ansible:latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION  || 'ca-central-1' }}
      TM_DB_ENV_TYPE: ${{ vars.TM_DB_ENV_TYPE }} # onpremise, ecs, ec2
      AWS_SSM_BUCKET: ${{ vars.TM_SSM_TRANSFER_BUCKET_NAME }}
      TM_INSTANCE_ID: ${{ vars.TM_INSTANCE_ID }}
      DUMP_TYPE: partial
      SERVER_USERNAME: ${{ vars.SERVER_USER_NAME }}
      CLIENT_PROJECT: ${{ vars.TM_TMDT_PROJECT_NAME }}
      DUMP_INSTANCE_NAME: ${{ vars.TM_DUMP_INSTANCE_NAME }}
      ANSIBLE_VERBOSITY: ${{ vars.ANSIBLE_VERBOSITY }}
      ANSIBLE_PYTHON_INTERPRETER: ${{ vars.ANSIBLE_PYTHON_INTERPRETER || 'auto_silent' }}
    steps:
    - name: Checkout client repo
      uses: actions/checkout@v4

    - name: Setup AWS CLI
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ secrets.aws-oidc-role-arn }}
        role-duration-seconds: 1200
        special-characters-workaround: true

    - name: Start bastion
      if: ${{ vars.TM_DB_ENV_TYPE == 'ecs' }}
      run: |
        ansible-playbook -i /ansible/inventory/bastion_auto_inventory.aws_ec2.yml \
        -e state=running \
        /ansible/playbooks/aws/manage-instance.yml

    - name: Export DB
      run: |
        ansible-playbook -i /ansible/inventory/ssm.ini \
        -i /ansible/inventory/${TM_DB_ENV_TYPE}_db_export_inventory.aws_ec2.yml \
        -e ansible_python_interpreter=${ANSIBLE_PYTHON_INTERPRETER} \
        -e env_type=${TM_DB_ENV_TYPE} \
        /ansible/playbooks/db-export.yml

    - name: Stop bastion
      if: ${{ vars.TM_DB_ENV_TYPE == 'ecs' }}
      run: |
        ansible-playbook -i /ansible/inventory/bastion_auto_inventory.aws_ec2.yml \
        -e state=stopped \
        /ansible/playbooks/aws/manage-instance.yml

    - name: Save artifact
      uses: actions/upload-artifact@v4
      with:
        name: db-dump
        path: /dump/latest.sql.gz
        retention-days: 1

  Upload:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    needs: Export
    env:
      AWS_REGION:  ${{ vars.AWS_REGION  || 'ca-central-1' }}
      BUCKET_NAME: ${{ vars.TM_TMDT_BUCKET_NAME }}
      S3_KEY: ${{ vars.TM_TMDT_PROJECT_NAME }}/latest.sql

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: db-dump
          path: .

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
            aws-region: ${{ env.AWS_REGION }}
            role-to-assume: ${{ secrets.tm-tmdt-aws-oidc-role-arn }}
            role-duration-seconds: 1200
            special-characters-workaround: true

      - name: Upload to S3
        run: |
          gzip -d latest.sql.gz
          aws s3 cp latest.sql s3://${{ env.BUCKET_NAME }}/${{ env.S3_KEY }}

  # Un échec n'affecte ni le run ni l'envoi de latest.sql.
  Anonymize:
    if: ${{ vars.TM_ANONYMIZE == 'true' }} # variable de dépôt, pas d'environnement
    needs: Export
    continue-on-error: true
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ca-central-1' }}
      BUCKET_NAME: ${{ vars.TM_TMDT_BUCKET_NAME }}
      S3_KEY: ${{ vars.TM_TMDT_PROJECT_NAME }}/latest_anonymized.sql

    steps:
      - name: Checkout client repo
        uses: actions/checkout@v4

      - name: Checkout tm-workflows
        uses: actions/checkout@v4
        with:
          repository: toumoro/tm-workflows
          ref: ${{ inputs.tools-ref }}
          path: .tm-workflows

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: db-dump
          path: dump

      - name: Anonymize
        uses: ./.tm-workflows/actions/anonymize-database
        with:
          dump: dump/latest.sql.gz
          output: latest_anonymized.sql

      # Aussi en artifact : récupérable sans AWS (ddev pull github de l'add-on ddev-toumoro, tests des PR)
      - name: Save anonymized artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-dump-anonymized
          path: latest_anonymized.sql
          retention-days: 4 # export du lundi au vendredi : l'artifact du vendredi doit durer jusqu'au lundi

      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.tm-tmdt-aws-oidc-role-arn }}
          role-duration-seconds: 1200
          special-characters-workaround: true

      - name: Upload to S3
        run: aws s3 cp latest_anonymized.sql "s3://${BUCKET_NAME}/${S3_KEY}"
