##
# Anonymise un dump MySQL dans une base jetable et produit un nouveau fichier SQL.
# Règles : un fichier commun de rules/ (typo3-core par défaut), complété par le fichier du projet.
##

name: Anonymize database
description: Anonymise un dump MySQL selon des règles communes et projet

inputs:
  dump:
    description: Dump source (.sql ou .sql.gz)
    required: true
  output:
    description: Fichier SQL anonymisé à produire
    required: false
    default: latest_anonymized.sql
  project-rules:
    description: Règles propres au projet (facultatif)
    required: false
    default: .github/anonymize.yml
  core-rules:
    description: Règles communes, nom d'un fichier de rules/ sans .yml (ex. typo3-core), ou none
    required: false
    default: typo3-core
  mysql-image:
    description: Image MySQL de la base jetable
    required: false
    default: mysql:8.0

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: pip install --quiet pyyaml==6.0.2

    - name: Anonymize
      shell: bash
      env:
        DUMP: ${{ inputs.dump }}
        OUTPUT: ${{ inputs.output }}
        PROJECT_RULES: ${{ inputs.project-rules }}
        MYSQL_IMAGE: ${{ inputs.mysql-image }}
        CORE_RULES: ${{ inputs.core-rules }}
      run: |
        core_rules=""
        if [ "$CORE_RULES" != "none" ]; then
          core_rules="$GITHUB_ACTION_PATH/rules/$CORE_RULES.yml"
          if [[ ! "$CORE_RULES" =~ ^[A-Za-z0-9_-]+$ ]] || [ ! -f "$core_rules" ]; then
            echo "Règles communes inconnues : $CORE_RULES"
            exit 1
          fi
        fi
        python "$GITHUB_ACTION_PATH/anonymize.py" \
          --dump "$DUMP" \
          --output "$OUTPUT" \
          --core-rules "$core_rules" \
          --project-rules "$PROJECT_RULES" \
          --mysql-image "$MYSQL_IMAGE"
